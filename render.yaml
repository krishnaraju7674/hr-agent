services:
  - type: web
    name: hr-recruitment-ai
    env: node
    buildCommand: npm install --prefix client && npm --prefix client run build
    startCommand: npm install --prefix server && node server/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: USE_IN_MEMORY_DB
        value: "true"
      - key: MONGO_URI
        value: mongodb://127.0.0.1:27017/hr-recruitment
      - key: JWT_SECRET
        value: hr-agent-super-secret-jwt-key-2024
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20
